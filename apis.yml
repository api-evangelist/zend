name: Zend
description: 'Zend is the enterprise PHP platform business of Perforce Software, providing production-grade
  PHP runtimes, tooling, and long-term support for mission-critical applications. Its portfolio spans
  ZendPHP (a hardened, enterprise-supported PHP runtime with LTS builds for end-of-life PHP versions),
  ZendHQ (PHP application observability and monitoring), Zend Server, Zend Studio, and Zend Guard, along
  with migration, modernization, performance auditing, and Black Belt support services for Laravel, Symfony,
  CodeIgniter, and CakePHP teams. Zend ships product tooling and a documentation surface rather than a
  public REST API.'
